version: 2.1

executors:
  docker-builder:
    docker:
      - image: cimg/base:current
    resource_class: large

jobs:
  build-and-push:
    executor: docker-builder
    steps:
      - checkout
      
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      
      - run:
          name: Set environment variables
          command: |
            echo "export REGISTRY=ghcr.io" >> $BASH_ENV
            echo "export IMAGE_NAME=$GITHUB_USERNAME/$GITHUB_PROJECT" >> $BASH_ENV
            echo "export IMAGE_TAG=$(date +'%Y.%m.%d').${CIRCLE_BUILD_NUM}" >> $BASH_ENV
            source $BASH_ENV

      - run:
          name: Plan a deploy
          command: circleci run release plan --target-version=$IMAGE_TAG
      
      - run:
          name: Log in to GitHub Container Registry
          command: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin
      
      - run:
          name: Build Docker image with progress output
          no_output_timeout: 30m
          command: |
            echo "🏗️  Building Docker image..."
            echo "Registry: ${REGISTRY}"
            echo "Image: ${IMAGE_NAME}"
            echo "Tag: ${IMAGE_TAG}"
            echo ""
            
            # Use --progress=plain to see all build output
            docker build \
              --progress=plain \
              --build-arg NEXT_PUBLIC_SERVER_URL="$NEXT_PUBLIC_SERVER_URL" \
              --build-arg PAYLOAD_SECRET="$PAYLOAD_SECRET" \
              --build-arg DATABASE_URI="$DATABASE_URI" \
              --build-arg S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
              --build-arg S3_BUCKET="$S3_BUCKET" \
              --build-arg S3_ENDPOINT="$S3_ENDPOINT" \
              --build-arg S3_REGION="$S3_REGION" \
              --build-arg S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
              -t ${REGISTRY}/${IMAGE_NAME}:latest \
              -t ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} \
              . 2>&1 | tee build.log
            
            echo ""
            echo "✅ Build completed"
            echo "📦 Image size:"
            docker images ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
      
      - run:
          name: Inspect build output
          command: |
            echo "🔍 Inspecting Docker image layers..."
            docker history ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
            
            echo ""
            echo "📋 Checking .next directory structure..."
            docker run --rm ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} sh -c "ls -lah .next/ && echo '' && ls -lah .next/static/ 2>/dev/null || echo 'No static directory'"
      
      - run:
          name: Push Docker image
          command: |
            echo "⬆️  Pushing images to registry..."
            docker push ${REGISTRY}/${IMAGE_NAME}:latest
            docker push ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
            echo "✅ Push completed"
      
      - run:
          name: Trigger Coolify Deployment
          command: |
            echo "🚀 Triggering Coolify deployment..."
            curl --request GET "$COOLIFY_WEBHOOK" --header "Authorization: Bearer $COOLIFY_TOKEN"
            echo "✅ Deployment triggered"

      - run:
          name: Update a deploy to SUCCESS
          command: circleci run release update --status=SUCCESS 
          when: on_success 

      - run:
          name: Update planned deploy to FAILED
          command: circleci run release update --status=FAILED 
          when: on_fail  

      - store_artifacts:
          path: build.log
          destination: docker-build-log

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-and-push:
          filters:
            branches:
              only: main